<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>Nextwave R&amp;D 2026</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--paper:#f0ebe1;--panel:#fffaf0;--ink:#1a1a1a;--soft:#ece6d8;--line:#dcd5c4;--muted:#6e6655;--dim:#a39c8e;--accent:#F4B3D5;--deep:#b8456b;--wash:#fdeef6;--ease:cubic-bezier(.16,1,.3,1)}
html,body{height:100%}
body{font-family:Inter,-apple-system,BlinkMacSystemFont,sans-serif;color:var(--ink);-webkit-font-smoothing:antialiased;letter-spacing:-.012em;overflow:hidden}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
.behind{position:fixed;inset:0;background:radial-gradient(120% 80% at 50% -10%,var(--wash),rgba(255,255,255,0) 55%),var(--paper)}
.stage{position:fixed;inset:0;z-index:10;display:flex;align-items:center;justify-content:center;padding:40px}
.card{width:min(1180px,100%);height:min(680px,86vh);display:grid;grid-template-columns:56% 1fr;background:var(--panel);border:1px solid rgba(26,26,26,.08);border-radius:24px;overflow:hidden;box-shadow:0 30px 70px rgba(26,26,26,.30),0 1px 0 rgba(255,255,255,.6) inset;animation:cardin .42s var(--ease)}
@keyframes cardin{from{opacity:0;transform:translateY(16px) scale(.985)}to{opacity:1;transform:none}}
.visual{position:relative;overflow:hidden;background:linear-gradient(160deg,#f7f3ea,#efe9dd);display:flex;align-items:center;justify-content:center;padding:22px}
.visual img{max-width:100%;max-height:100%;width:auto;height:auto;object-fit:contain;display:block;border-radius:10px;box-shadow:0 18px 44px rgba(26,26,26,.22);transition:opacity .32s var(--ease)}
.visual img.contain{object-fit:contain;object-position:center;background:#fff}
.qnum{position:absolute;bottom:14px;left:22px;z-index:4;font-size:11px;letter-spacing:.16em;text-transform:uppercase;font-weight:800;color:var(--muted)}
.body{position:relative;display:flex;flex-direction:column;justify-content:center;padding:52px 58px 96px;background:#fff;min-width:0;overflow:hidden}
.kind{position:absolute;top:26px;right:28px;padding:9px 18px;border-radius:100px;font-size:12px;letter-spacing:.12em;text-transform:uppercase;font-weight:800;background:rgba(26,26,26,.86);color:#fff}
.kind.re{background:#2f4f6f}.kind.fam{background:var(--deep)}.kind.num{background:#4a5d3f}
.seatline{font-size:12px;font-weight:800;letter-spacing:.18em;text-transform:uppercase;color:var(--dim);margin-bottom:16px}
h1{font-size:40px;font-weight:800;line-height:1.14;letter-spacing:-.03em;margin-bottom:18px}
.card.title h1{font-size:52px}
p{font-size:19px;line-height:1.6;color:#33373b;margin:12px 0;max-width:46ch}
p b{color:var(--ink);font-weight:700}
ul{margin:10px 0 0 20px}li{font-size:18px;line-height:1.55;color:#33373b;margin:8px 0;max-width:44ch}
.nav{position:absolute;left:58px;right:28px;bottom:30px;display:flex;align-items:center;gap:14px}
.btn{padding:12px 26px;border-radius:999px;font-size:15px;font-weight:800;letter-spacing:-.01em;background:var(--ink);color:#fff;transition:transform .12s ease,opacity .2s}
.btn.ghost{background:transparent;color:var(--muted);border:2px solid var(--line)}
.btn:active{transform:scale(.96)}.btn[disabled]{opacity:.3;pointer-events:none}
.count{margin-left:auto;font-size:13px;font-weight:700;color:var(--dim);letter-spacing:.04em}
.bar{position:fixed;left:0;top:0;height:3px;background:var(--deep);z-index:30;transition:width .32s var(--ease)}
.hint{position:fixed;bottom:14px;left:0;right:0;text-align:center;font-size:12px;color:var(--dim);z-index:20;letter-spacing:.02em}
@media (max-width:900px){
 .stage{padding:0}
 .card{width:100%;height:100%;border-radius:0;grid-template-columns:1fr;grid-template-rows:40% 1fr}
 .body{padding:26px 24px 92px;justify-content:flex-start;overflow-y:auto}
 .kind{top:auto;bottom:calc(62% + 14px);right:16px}
 h1{font-size:27px}.card.title h1{font-size:32px}
 p{font-size:16px}li{font-size:15px}
 .nav{left:24px;right:16px;bottom:20px}
 .hint{display:none}
}
</style>
</head>

 h:"<p>Monday to Thursday there is no answer grid at all. A postcard arrives with things in it, she taps a thing, and her companion explains what it is.</p><p>The facts land in her case notebook. Only Friday asks her to name the country, and by then she is deducing, not guessing.</p>",

 h:"<p>A fully bespoke daily set is currently around a dollar or so per child per day, all in.</p><p>At any scale only about a third of the cards need to be bespoke; the rest are reused across a year-level cohort. That takes it toward a few dollars per child per month.</p><p>Card art alone came down from <b>39MB to 3.3MB</b> this week.</p><p>Run cost is compute and hosting. Monthly, cancellable, nothing locked in.</p>",
 lab:"Ingest surface"},

var i=0,N=CARDS.length,stage=document.getElementById('stage'),bar=document.getElementById('bar');
function render(){
  var c=CARDS[i];
  stage.innerHTML='<div class="card'+(c.title?' title':'')+'">'
   +'<div class="visual"><img src="'+c.img+'" alt=""><div class="qnum">'+c.lab+'</div></div>'
   +'<div class="body"><div class="kind '+(c.cls||'')+'">'+c.kind+'</div>'
   +'<div class="seatline">'+c.track+'</div>'
   +'<h1>'+c.t+'</h1>'+c.h
   +'<div class="nav">'
   +'<button class="btn ghost" id="prev"'+(i===0?' disabled':'')+'>Back</button>'
   +'<button class="btn" id="next">'+(i===N-1?'Start again':'Next')+'</button>'
   +'<span class="count">'+(i+1)+' / '+N+'</span>'
   +'</div></div></div>';
  bar.style.width=((i+1)/N*100)+'%';
  document.getElementById('next').onclick=function(){ i=(i+1)%N; render(); };
  document.getElementById('prev').onclick=function(){ if(i>0){i--;render();} };
}
function go(d){ var n=i+d; if(n<0||n>=N) return; i=n; render(); }
document.addEventListener('keydown',function(e){
  if(e.key==='ArrowRight'||e.key===' '||e.key==='PageDown'){e.preventDefault();go(1);}
  if(e.key==='ArrowLeft'||e.key==='PageUp'){e.preventDefault();go(-1);}
  if(e.key==='Home'){i=0;render();}
  if(e.key==='End'){i=N-1;render();}
});
var sx=0,sy=0;
document.addEventListener('touchstart',function(e){sx=e.touches[0].clientX;sy=e.touches[0].clientY;},{passive:true});
document.addEventListener('touchend',function(e){
  var dx=e.changedTouches[0].clientX-sx, dy=e.changedTouches[0].clientY-sy;
  if(Math.abs(dx)>52&&Math.abs(dx)>Math.abs(dy)) go(dx<0?1:-1);
},{passive:true});
CARDS.forEach(function(c){ var im=new Image(); im.src=c.img; });
render();
